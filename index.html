<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blank Shopping Cart</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --panel-soft: #fafafa;
        --border: #e9e9e9;
        --text: #111111;
        --muted: #666666;
        --primary: #111111;
        --primary-soft: #f0f0f0;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
      }
      .brand {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .nav {
        display: flex;
        gap: 22px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .cart-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--primary-soft);
        border: 1px solid var(--border);
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .cart-count {
        background: var(--primary);
        color: white;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 0.78rem;
      }
      .page {
        padding: 42px 0 80px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.7fr 0.9fr;
        gap: 28px;
      }
      .products {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .section-title {
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }
      .blank-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .placeholder-card {
        background: var(--panel-soft);
        border: 1px dashed var(--border);
        border-radius: 14px;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .cart-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 24px;
        height: fit-content;
      }
      .cart-panel h3 {
        margin: 0 0 18px;
        font-size: 1.5rem;
      }
      .empty-state {
        background: var(--panel-soft);
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 22px 18px;
        text-align: center;
        color: var(--muted);
        line-height: 1.6;
      }
      .summary {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--muted);
      }
      .row.total {
        color: var(--text);
        font-size: 1.1rem;
        font-weight: 700;
        margin-top: 14px;
      }
      .checkout {
        margin-top: 16px;
        width: 100%;
        border: none;
        background: var(--primary);
        color: white;
        padding: 14px 18px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .nav { display: none; }
        .blank-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container topbar">
        <div class="brand">SHOP</div>

        <nav class="nav">
          <a href="#">Home</a>
          <a href="#">New</a>
          <a href="#">Collection</a>
          <a href="#">About</a>
        </nav>

        <a href="#cart" class="cart-btn">
          Cart
          <span class="cart-count">0</span>
        </a>
      </div>
    </header>

    <main class="page">
      <div class="container layout">
        <section class="products">
          <h2 class="section-title">Products</h2>

          <div class="blank-grid">
            <div class="placeholder-card">Product slot</div>
            <div class="placeholder-card">Product slot</div>
            <div class="placeholder-card">Product slot</div>
            <div class="placeholder-card">Product slot</div>
          </div>
        </section>

        <aside id="cart" class="cart-panel">
          <h3>Your Cart</h3>

          <div class="empty-state">
            Your cart is empty.<br />
            Add products to begin.
          </div>

          <div class="summary">
            <div class="row">
              <span>Subtotal</span>
              <span>$0.00</span>
            </div>
            <div class="row">
              <span>Shipping</span>
              <span>$0.00</span>
            </div>
            <div class="row total">
              <span>Total</span>
              <span>$0.00</span>
            </div>

            <button class="checkout">Checkout</button>
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
